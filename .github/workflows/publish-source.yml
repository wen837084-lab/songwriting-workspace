name: Publish source archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-source.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish tracked source
        shell: bash
        run: |
          unzip -o songwriting-workspace-e704d53802854a038993f67961745370.zip
          rm songwriting-workspace-e704d53802854a038993f67961745370.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete songwriting workspace"
          git push
